<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="400" height="400">
  <defs>
    <linearGradient id="top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#7DA8FF" stop-opacity="0.85"/>
      <stop offset="60%"  stop-color="#2167E0" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0542AC" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2167E0" stop-opacity="0.78"/>
      <stop offset="60%"  stop-color="#0542AC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0542AC" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0542AC" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#0542AC" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2167E0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <g id="APIS Cube - Solid Gem">

    <g id="Faces">
      <path id="Top Face"   d="M 0 -100 L 86.6 -50 L 0 0 L -86.6 -50 Z" fill="url(#top)"/>
      <path id="Right Face" d="M 86.6 -50 L 86.6 50 L 0 100 L 0 0 Z"    fill="url(#right)"/>
      <path id="Left Face"  d="M -86.6 -50 L 0 0 L 0 100 L -86.6 50 Z"  fill="url(#left)"/>
    </g>

    <g id="Outer Edges" fill="none" stroke="#0542AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path id="Edge 01" d="M 0 -100 L 86.6 -50"/>
      <path id="Edge 02" d="M 86.6 -50 L 86.6 50"/>
      <path id="Edge 03" d="M 86.6 50 L 0 100"/>
      <path id="Edge 04" d="M 0 100 L -86.6 50"/>
      <path id="Edge 05" d="M -86.6 50 L -86.6 -50"/>
      <path id="Edge 06" d="M -86.6 -50 L 0 -100"/>
    </g>

    <g id="Inner Seams" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <path id="Seam Up"          d="M 0 0 L 0 -100"/>
      <path id="Seam Lower Right" d="M 0 0 L 86.6 50"/>
      <path id="Seam Lower Left"  d="M 0 0 L -86.6 50"/>
    </g>

  </g>
</svg>
