<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- ════════════════════════════════════════════════════════════
       APIS Media — Post template 1080×1080 (square)
       Для Instagram, VK, OK
       ════════════════════════════════════════════════════════════ -->

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060D1B"/>
      <stop offset="35%"  stop-color="#0B1A3A"/>
      <stop offset="100%" stop-color="#0542AC"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0%"   stop-color="#2167E0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2167E0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7DA8FF" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="cube-top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#7DA8FF" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#2167E0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0542AC" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2167E0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0542AC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0542AC" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2167E0" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- ─── Фон ─── -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)" opacity="0.5"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- ═══ Большой куб справа-снизу (декорация) ═══ -->
  <g id="DECORATIVE-CUBE" transform="translate(820, 760)">
    <g transform="scale(2.8)">
      <path d="M0 -100 L86.6 -50 L0 0 L-86.6 -50 Z" fill="url(#cube-top)"/>
      <path d="M86.6 -50 L86.6 50 L0 100 L0 0 Z"    fill="url(#cube-right)"/>
      <path d="M-86.6 -50 L0 0 L0 100 L-86.6 50 Z"  fill="url(#cube-left)"/>
      <g fill="none" stroke="#7DA8FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
        <path d="M0 -100 L86.6 -50"/>
        <path d="M86.6 -50 L86.6 50"/>
        <path d="M86.6 50 L0 100"/>
        <path d="M0 100 L-86.6 50"/>
        <path d="M-86.6 50 L-86.6 -50"/>
        <path d="M-86.6 -50 L0 -100"/>
      </g>
      <g fill="none" stroke="#7DA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
        <path d="M0 0 L0 -100"/>
        <path d="M0 0 L86.6 50"/>
        <path d="M0 0 L-86.6 50"/>
      </g>
    </g>
  </g>

  <!-- ═══ TOP BAR ═══ -->
  <g id="TOP-BAR" transform="translate(0, 80)">
    <!-- Mini cube logo -->
    <g transform="translate(80, 0) scale(0.22)">
      <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -100 L86.6 -50"/>
        <path d="M86.6 -50 L86.6 50"/>
        <path d="M86.6 50 L0 100"/>
        <path d="M0 100 L-86.6 50"/>
        <path d="M-86.6 50 L-86.6 -50"/>
        <path d="M-86.6 -50 L0 -100"/>
      </g>
      <g fill="none" stroke="#7DA8FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 0 L0 -100"/>
        <path d="M0 0 L86.6 50"/>
        <path d="M0 0 L-86.6 50"/>
      </g>
    </g>
    <text id="EDIT-BRAND-NAME" x="160" y="4"  fill="#FFFFFF" font-family="Inter, sans-serif" font-size="26" font-weight="700" letter-spacing="0.5">ЭЙПИСМЕДИА</text>
    <text id="EDIT-PRODUCT"    x="160" y="32" fill="#7DA8FF" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">ЕС-ПРОФОСМОТР · МИС</text>
  </g>

  <!-- ═══ TITLE BLOCK (центральный, сдвинут немного выше центра) ═══ -->
  <g id="TITLE-BLOCK" transform="translate(80, 360)">
    <text id="EDIT-KICKER" x="0" y="0" fill="#7DA8FF" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="2">§ 02 · РЕГУЛЯТОРИКА</text>

    <text id="EDIT-TITLE" x="0" y="72" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">
      <tspan x="0" dy="0">Профосмотры</tspan>
      <tspan x="0" dy="88">по правилам</tspan>
      <tspan x="0" dy="88" fill="#7DA8FF">2026 года</tspan>
    </text>

    <text id="EDIT-DEK" x="0" y="380" fill="rgba(255,255,255,0.72)" font-family="Inter, sans-serif" font-size="22">
      <tspan x="0" dy="0">Что меняется после ввода</tspan>
      <tspan x="0" dy="34">приказа 201н от&#8201;14.04.2025</tspan>
    </text>
  </g>

  <!-- ═══ BOTTOM BAR ═══ -->
  <line x1="80" y1="960" x2="1000" y2="960" stroke="#7DA8FF" stroke-opacity="0.2" stroke-width="1"/>

  <text id="EDIT-URL"    x="80"   y="1010" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600" letter-spacing="0.6">prof-mo.site</text>
  <text id="EDIT-FOOTER" x="1000" y="1010" text-anchor="end" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.6">APIS MEDIA · 2026</text>
</svg>
